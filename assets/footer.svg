<svg xmlns="http://www.w3.org/2000/svg" width="900" height="140" viewBox="0 0 900 140">
  <defs>
    <linearGradient id="footerBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1a14"/><stop offset="100%" stop-color="#081210"/>
    </linearGradient>
    <linearGradient id="lineG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d1a14"/><stop offset="50%" stop-color="#00E5A0"/><stop offset="100%" stop-color="#0d1a14"/>
    </linearGradient>
    <filter id="gw"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .f-label { font:400 12px 'Segoe UI',Ubuntu,sans-serif; fill:#3d8a72; letter-spacing:1px; }
      .f-link  { font:600 13px 'Segoe UI',Ubuntu,sans-serif; fill:#7FFFD4; }
      .f-title { font:700 22px 'Segoe UI',Ubuntu,sans-serif; fill:#00E5A0; }

      .fade-in { animation: fi .8s ease-out .1s forwards; }
      @keyframes fi { from{opacity:0} to{opacity:1} }

      .wave-path { animation: wShift 5s ease-in-out infinite; }
      @keyframes wShift { 0%,100%{d:path("M0 40 Q225 20 450 40 Q675 60 900 40 L900 140 L0 140 Z")} 50%{d:path("M0 55 Q225 35 450 55 Q675 75 900 55 L900 140 L0 140 Z")} }

      .pill { fill:#122b21; stroke:#1a3d2e; stroke-width:1; }
      .pill-hover { animation: pillPop .5s ease-out forwards; }
      .p1{animation-delay:.1s}.p2{animation-delay:.22s}.p3{animation-delay:.34s}
      @keyframes pillPop { from{opacity:0;transform:scale(.8)} to{opacity:1;transform:scale(1)} }
    </style>
  </defs>

  <rect width="900" height="140" fill="url(#footerBg)"/>

  <rect x="0" y="0" width="900" height="1.5" fill="url(#lineG)"/>

  <path class="wave-path" d="M0 40 Q225 20 450 40 Q675 60 900 40 L900 140 L0 140 Z" fill="#081210"/>

  <g class="fade-in">
    <text class="f-title" x="450" y="36" text-anchor="middle" filter="url(#gw)">Open to collaboration</text>
    <text class="f-label" x="450" y="54" text-anchor="middle">Backend · AI Tooling · Open Source</text>
  </g>

  <g class="pill-hover p1">
    <rect x="315" y="68" width="120" height="34" rx="17" class="pill"/>
    <text class="f-link" x="375" y="90" text-anchor="middle">github.com/zona-0</text>
  </g>

  <g class="pill-hover p2">
    <rect x="455" y="68" width="90" height="34" rx="17" class="pill"/>
    <text class="f-link" x="500" y="90" text-anchor="middle">5 followers</text>
  </g>

  <g class="pill-hover p3">
    <rect x="562" y="68" width="80" height="34" rx="17" class="pill"/>
    <text class="f-link" x="602" y="90" text-anchor="middle">10 repos</text>
  </g>
</svg>
