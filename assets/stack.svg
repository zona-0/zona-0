<svg xmlns="http://www.w3.org/2000/svg" width="820" height="300" viewBox="0 0 820 300" fill="none" role="img" aria-label="Tech stack orbit">
  <defs>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#7FFFD4"/>
      <stop offset="100%" stop-color="#00E5A0" stop-opacity="0"/>
    </radialGradient>

    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <style>
      .ring { fill: none; stroke: #1e4438; stroke-width: 1.2; }
      .ring-lit { fill: none; stroke: #00E5A0; stroke-width: 1.4; opacity: .5;
                  stroke-dasharray: 10 320; animation: dash 6s linear infinite; }
      @keyframes dash { to { stroke-dashoffset: -330; } }

      .node { font: 700 13px 'Segoe UI', Ubuntu, sans-serif; fill: #0d1117; }
      .cap  { font: 700 20px 'Segoe UI', Ubuntu, sans-serif; fill: #7FFFD4; }
      .cap2 { font: 400 12px 'Segoe UI', Ubuntu, sans-serif; fill: #4d7f72; }

      .spin  { animation: spin 22s linear infinite; transform-origin: 410px 160px; }
      .spin2 { animation: spin 30s linear infinite reverse; transform-origin: 410px 160px; }
      @keyframes spin { to { transform: rotate(360deg); } }

      .counter  { animation: counter 22s linear infinite; }
      .counter2 { animation: counter2 30s linear infinite; }
      @keyframes counter  { to { transform: rotate(-360deg); } }
      @keyframes counter2 { to { transform: rotate(360deg); } }

      .breathe { animation: breathe 3.2s ease-in-out infinite; transform-origin: 410px 160px; }
      @keyframes breathe { 0%,100% { transform: scale(1); opacity:.9 } 50% { transform: scale(1.14); opacity:1 } }

      .fade { animation: f .8s ease-out both; }
      @keyframes f { from { opacity: 0 } to { opacity: 1 } }
    </style>
  </defs>

  <rect width="820" height="300" rx="14" fill="#0d1117" stroke="#1d3830"/>

  <g class="fade">
    <text class="cap" x="34" y="42">Tech Stack</text>
    <text class="cap2" x="34" y="62">Languages and frameworks I work with</text>
  </g>

  <!-- orbit rings -->
  <ellipse class="ring" cx="410" cy="160" rx="180" ry="62"/>
  <ellipse class="ring" cx="410" cy="160" rx="110" ry="38"/>
  <ellipse class="ring-lit" cx="410" cy="160" rx="180" ry="62"/>

  <!-- core -->
  <circle class="breathe" cx="410" cy="160" r="34" fill="url(#core)"/>
  <circle cx="410" cy="160" r="15" fill="#00E5A0" filter="url(#soft)"/>

  <!-- outer orbit nodes -->
  <g class="spin">
    <g transform="translate(590,160)">
      <g class="counter">
        <rect x="-30" y="-13" width="60" height="26" rx="13" fill="#7FFFD4" filter="url(#soft)"/>
        <text class="node" x="0" y="5" text-anchor="middle">Go</text>
      </g>
    </g>
    <g transform="translate(410,222)">
      <g class="counter">
        <rect x="-42" y="-13" width="84" height="26" rx="13" fill="#5EEBC0" filter="url(#soft)"/>
        <text class="node" x="0" y="5" text-anchor="middle">JavaScript</text>
      </g>
    </g>
    <g transform="translate(230,160)">
      <g class="counter">
        <rect x="-30" y="-13" width="60" height="26" rx="13" fill="#4BDDAE" filter="url(#soft)"/>
        <text class="node" x="0" y="5" text-anchor="middle">Java</text>
      </g>
    </g>
    <g transform="translate(410,98)">
      <g class="counter">
        <rect x="-28" y="-13" width="56" height="26" rx="13" fill="#3ACF9E" filter="url(#soft)"/>
        <text class="node" x="0" y="5" text-anchor="middle">Vue</text>
      </g>
    </g>
  </g>

  <!-- inner orbit nodes -->
  <g class="spin2">
    <g transform="translate(520,160)">
      <g class="counter2">
        <rect x="-28" y="-12" width="56" height="24" rx="12" fill="#2FBF90" filter="url(#soft)"/>
        <text class="node" x="0" y="4" text-anchor="middle">HTML</text>
      </g>
    </g>
    <g transform="translate(300,160)">
      <g class="counter2">
        <rect x="-26" y="-12" width="52" height="24" rx="12" fill="#2FBF90" filter="url(#soft)"/>
        <text class="node" x="0" y="4" text-anchor="middle">Git</text>
      </g>
    </g>
  </g>
</svg>