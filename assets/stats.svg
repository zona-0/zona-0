<svg xmlns="http://www.w3.org/2000/svg" width="900" height="190" viewBox="0 0 900 190">
  <defs>
    <linearGradient id="cardG1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#122b21"/><stop offset="100%" stop-color="#0d1a14"/>
    </linearGradient>
    <filter id="gw"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .c-val  { font:800 38px 'Segoe UI',Ubuntu,sans-serif; fill:#00E5A0; }
      .c-label{ font:500 13px 'Segoe UI',Ubuntu,sans-serif; fill:#4dbb97; letter-spacing:1.5px; }
      .c-sub  { font:400 11px 'Segoe UI',Ubuntu,sans-serif; fill:#2d6a54; }
      .divider{ stroke:#1a3d2e; stroke-width:1; }
      .card   { fill:url(#cardG1); stroke:#1a3d2e; stroke-width:1; }

      .cnt { animation: countUp 1.4s ease-out forwards; }
      .c1{animation-delay:.1s}.c2{animation-delay:.3s}.c3{animation-delay:.5s}.c4{animation-delay:.7s}
      @keyframes countUp { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:none} }

      .ring-anim { stroke-dasharray:0 188;
                   animation: ringGrow 1.4s cubic-bezier(.22,.9,.28,1) .3s forwards; }
      @keyframes ringGrow { to { stroke-dasharray:56 132; } }

      .pulse { animation: blink 2.6s ease-in-out infinite; }
      @keyframes blink { 0%,100%{opacity:.4} 50%{opacity:1} }
    </style>
  </defs>

  <rect width="900" height="190" rx="14" class="card"/>

  <!-- dividers -->
  <line class="divider" x1="225" y1="20" x2="225" y2="170"/>
  <line class="divider" x1="450" y1="20" x2="450" y2="170"/>
  <line class="divider" x1="675" y1="20" x2="675" y2="170"/>

  <!-- Card 1: Total Contributions -->
  <g transform="translate(112,95)">
    <g class="cnt c1">
      <text class="c-val" x="0" y="-14" text-anchor="middle" filter="url(#gw)">158</text>
      <text class="c-label" x="0" y="10" text-anchor="middle">TOTAL CONTRIBUTIONS</text>
      <text class="c-sub"   x="0" y="26" text-anchor="middle">Aug 2024 – Present</text>
    </g>
  </g>

  <!-- Card 2: Current Streak (ring) -->
  <g transform="translate(337,95)">
    <!-- ring track -->
    <circle cx="0" cy="-20" r="30" fill="none" stroke="#1a3d2e" stroke-width="7"/>
    <!-- ring fill -->
    <circle class="ring-anim" cx="0" cy="-20" r="30" fill="none" stroke="#00E5A0" stroke-width="7"
            stroke-linecap="round" transform="rotate(-90)" filter="url(#gw)"/>
    <g class="cnt c2">
      <text class="c-val" x="0" y="-14" text-anchor="middle" font-size="26">1</text>
      <text class="c-label" x="0" y="18" text-anchor="middle">CURRENT STREAK</text>
      <text class="c-sub"   x="0" y="34" text-anchor="middle">Aug 13, 2026</text>
    </g>
    <!-- flame icon custom -->
    <g transform="translate(-6,-50)" class="pulse">
      <path d="M6 0 C6 0 10 4 9 8 C12 5 11 1 10 0 C12 3 14 7 12 11 C10 15 6 16 6 16 C6 16 8 14 7 11 C5 13 4 15 4 16 C2 13 2 9 4 6 C3 8 2 10 3 12 C1 8 2 3 6 0Z" fill="#00E5A0" filter="url(#gw)"/>
    </g>
  </g>

  <!-- Card 3: Longest Streak -->
  <g transform="translate(562,95)">
    <g class="cnt c3">
      <text class="c-val" x="0" y="-14" text-anchor="middle" filter="url(#gw)">3</text>
      <text class="c-label" x="0" y="10" text-anchor="middle">LONGEST STREAK</text>
      <text class="c-sub"   x="0" y="26" text-anchor="middle">May 16 – 18, 2025</text>
    </g>
  </g>

  <!-- Card 4: Public Repos -->
  <g transform="translate(787,95)">
    <g class="cnt c4">
      <text class="c-val" x="0" y="-14" text-anchor="middle" filter="url(#gw)">10</text>
      <text class="c-label" x="0" y="10" text-anchor="middle">PUBLIC REPOS</text>
      <text class="c-sub"   x="0" y="26" text-anchor="middle">github.com/zona-0</text>
    </g>
  </g>
</svg>
