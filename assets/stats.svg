<svg xmlns="http://www.w3.org/2000/svg" width="900" height="160" viewBox="0 0 900 160">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#122b21"/>
      <stop offset="100%" stop-color="#0d1a14"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="160" rx="14" fill="url(#bg)" stroke="#1a3d2e" stroke-width="1"/>

  <line x1="225" y1="24" x2="225" y2="136" stroke="#1a3d2e" stroke-width="1"/>
  <line x1="450" y1="24" x2="450" y2="136" stroke="#1a3d2e" stroke-width="1"/>
  <line x1="675" y1="24" x2="675" y2="136" stroke="#1a3d2e" stroke-width="1"/>

  <g transform="translate(112,80)">
    <text x="0" y="-8" text-anchor="middle" font-family="Segoe UI,Ubuntu,sans-serif" font-size="42" font-weight="800" fill="#00E5A0" filter="url(#glow)">158</text>
    <text x="0" y="18" text-anchor="middle" font-family="Segoe UI,Ubuntu,sans-serif" font-size="11" font-weight="600" fill="#4dbb97" letter-spacing="2">TOTAL CONTRIBUTIONS</text>
    <text x="0" y="34" text-anchor="middle" font-family="Segoe UI,Ubuntu,sans-serif" font-size="11" fill="#2d6a54">Aug 2024 – Present</text>
  </g>

  <g transform="translate(337,80)">
    <text x="0" y="-8" text-anchor="middle" font-family="Segoe UI,Ubuntu,sans-serif" font-size="42" font-weight="800" fill="#00E5A0" filter="url(#glow)">1</text>
    <text x="0" y="18" text-anchor="middle" font-family="Segoe UI,Ubuntu,sans-serif" font-size="11" font-weight="600" fill="#4dbb97" letter-spacing="2">CURRENT STREAK</text>
    <text x="0" y="34" text-anchor="middle" font-family="Segoe UI,Ubuntu,sans-serif" font-size="11" fill="#2d6a54">Aug 13, 2026</text>
  </g>

  <g transform="translate(562,80)">
    <text x="0" y="-8" text-anchor="middle" font-family="Segoe UI,Ubuntu,sans-serif" font-size="42" font-weight="800" fill="#00E5A0" filter="url(#glow)">3</text>
    <text x="0" y="18" text-anchor="middle" font-family="Segoe UI,Ubuntu,sans-serif" font-size="11" font-weight="600" fill="#4dbb97" letter-spacing="2">LONGEST STREAK</text>
    <text x="0" y="34" text-anchor="middle" font-family="Segoe UI,Ubuntu,sans-serif" font-size="11" fill="#2d6a54">May 16 – 18, 2025</text>
  </g>

  <g transform="translate(787,80)">
    <text x="0" y="-8" text-anchor="middle" font-family="Segoe UI,Ubuntu,sans-serif" font-size="42" font-weight="800" fill="#00E5A0" filter="url(#glow)">10</text>
    <text x="0" y="18" text-anchor="middle" font-family="Segoe UI,Ubuntu,sans-serif" font-size="11" font-weight="600" fill="#4dbb97" letter-spacing="2">PUBLIC REPOS</text>
    <text x="0" y="34" text-anchor="middle" font-family="Segoe UI,Ubuntu,sans-serif" font-size="11" fill="#2d6a54">github.com/zona-0</text>
