<svg xmlns="http://www.w3.org/2000/svg" width="900" height="190" viewBox="0 0 900 190">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#122b21"/>
      <stop offset="100%" stop-color="#0d1a14"/>
    </linearGradient>
    <linearGradient id="ringG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00E5A0"/>
      <stop offset="100%" stop-color="#7FFFD4"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="190" rx="14" fill="url(#bg)" stroke="#1a3d2e" stroke-width="1"/>
  <line x1="225" y1="16" x2="225" y2="174" stroke="#1a3d2e" stroke-width="1"/>
  <line x1="450" y1="16" x2="450" y2="174" stroke="#1a3d2e" stroke-width="1"/>
  <line x1="675" y1="16" x2="675" y2="174" stroke="#1a3d2e" stroke-width="1"/>

  <!-- CARD 1: Total Contributions — bar chart icon top -->
  <g transform="translate(112,95)">
    <g transform="translate(-22,-78)">
      <rect x="0"  y="20" width="7" height="8"  fill="#00E5A0" opacity="0.45"/>
      <rect x="9"  y="13" width="7" height="15" fill="#00E5A0" opacity="0.65"/>
      <rect x="18" y="6"  width="7" height="22" fill="#00E5A0" filter="url(#glow)"/>
      <rect x="27" y="14" width="7" height="14" fill="#00E5A0" opacity="0.65"/>
      <rect x="36" y="21" width="7" height="7"  fill="#00E5A0" opacity="0.45"/>
      <animate attributeName="opacity" values="0.8;1;0.8" dur="3s" repeatCount="indefinite"/>
    </g>
    <text x="0" y="6" text-anchor="middle" font-family="Segoe UI,Ubuntu,sans-serif" font-size="40" font-weight="800" fill="#00E5A0" filter="url(#glow)">158</text>
    <text x="0" y="28" text-anchor="middle" font-family="Segoe UI,Ubuntu,sans-serif" font-size="10" font-weight="700" fill="#4dbb97" letter-spacing="1.5">TOTAL CONTRIBUTIONS</text>
    <text x="0" y="44" text-anchor="middle" font-family="Segoe UI,Ubuntu,sans-serif" font-size="10" fill="#2d6a54">Aug 2024 – Present</text>
  </g>

  <!-- CARD 2: Current Streak — ring + flame -->
  <g transform="translate(337,95)">
    <circle cx="0" cy="-52" r="22" fill="none" stroke="#1a3d2e" stroke-width="3"/>
    <circle cx="0" cy="-52" r="22" fill="none" stroke="url(#ringG)" stroke-width="3"
            stroke-dasharray="138" stroke-dashoffset="138" stroke-linecap="round"
            transform="rotate(-90,0,-52)" filter="url(#glow)">
      <animate attributeName="stroke-dashoffset" from="138" to="23" dur="1.4s" begin="0.1s" fill="freeze"/>
    </circle>
    <text x="0" y="-44" text-anchor="middle" font-family="Segoe UI,Ubuntu,sans-serif" font-size="26" font-weight="800" fill="#00E5A0" filter="url(#glow)">1</text>
    <path d="M0,-68 C0,-68 3,-64 2,-61 C4,-63 5,-67 4,-69 C7,-64 6,-59 3,-57 C1,-55 -1,-54 -3,-56 C-5,-58 -5,-64 -2,-67 Z" fill="#00E5A0" filter="url(#glow)">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="1.5s" repeatCount="indefinite"/>
    </path>
    <text x="0" y="6" text-anchor="middle" font-family="Segoe UI,Ubuntu,sans-serif" font-size="10" font-weight="700" fill="#4dbb97" letter-spacing="1.5">CURRENT STREAK</text>
    <text x="0" y="22" text-anchor="middle" font-family="Segoe UI,Ubuntu,sans-serif" font-size="10" fill="#2d6a54">Aug 13, 2026</text>
  </g>

  <!-- CARD 3: Longest Streak — lightning + number -->
  <g transform="translate(562,95)">
    <path d="M3,-74 L-5,-58 L2,-58 L-6,-42 L8,-62 L1,-62 Z" fill="#00E5A0" filter="url(#glow)">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
    </path>
    <text x="0" y="6" text-anchor="middle" font-family="Segoe UI,Ubuntu,sans-serif" font-size="40" font-weight="800" fill="#00E5A0" filter="url(#glow)">3</text>
    <text x="0" y="28" text-anchor="middle" font-family="Segoe UI,Ubuntu,sans-serif" font-size="10" font-weight="700" fill="#4dbb97" letter-spacing="1.5">LONGEST STREAK</text>
    <text x="0" y="44" text-anchor="middle" font-family="Segoe UI,Ubuntu,sans-serif" font-size="10" fill="#2d6a54">May 16 – 18, 2025</text>
  </g>

  <!-- CARD 4: Public Repos — folder icon -->
  <g transform="translate(787,95)">
    <g transform="translate(-18,-82)">
      <rect x="0" y="12" width="36" height="24" rx="3" fill="#122b21" stroke="#00E5A0" stroke-width="1.2" filter="url(#glow)"/>
      <rect x="0" y="8"  width="14" height="6"  rx="2" fill="#00E5A0"/>
      <rect x="4" y="18" width="6"  height="1.5" rx="1" fill="#1a3d2e"/>
      <rect x="4" y="22" width="20" height="1.5" rx="1" fill="#1a3d2e"/>
      <rect x="4" y="26" width="14" height="1.5" rx="1" fill="#1a3d2e"/>
      <animate attributeName="opacity" values="0.8;1;0.8" dur="2.5s" repeatCount="indefinite"/>
    </g>
    <text x="0" y="6" text-anchor="middle" font-family="Segoe UI,Ubuntu,sans-serif" font-size="40" font-weight="800" fill="#00E5A0" filter="url(#glow)">10</text>
    <text x="0" y="28" text-anchor="middle" font-family="Segoe UI,Ubuntu,sans-serif" font-size="10" font-weight="700" fill="#4dbb97" letter-spacing="1.5">PUBLIC REPOS</text>
    <text x="0" y="44" text-anchor="middle" font-family="Segoe UI,Ubuntu,sans-serif" font-size="10" fill="#2d6a54">github.com/zona-0</text>
  </g>
</svg>
